module: src.client.agents.HTTPAgent
parameters:
  url: https://openrouter.ai/api/v1/chat/completions
  headers:
    Content-Type: application/json
    Authorization: Bearer <YOUR_OPENROUTER_API_KEY>
    # HTTP-Referer: https://your-site.com   # optional, shown on openrouter.ai rankings
    # X-Title: MedAgentBench                # optional, shown on openrouter.ai rankings
  body:
    model: minimax/minimax-m2.5:free
    temperature: 0
    max_tokens: 4096
  prompter:
    name: role_content_dict
    args:
      agent_role: assistant
  return_format: "{response[choices][0][message][content]}"
