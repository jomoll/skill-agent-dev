output_dir: "outputs/evo_memory_cycle"

agent:
  module: src.client.agents.HTTPAgent
  parameters:
    url: "http://10.32.16.43:4000/chat/completions"
    headers:
      Authorization: "Bearer sk--jYBY-YIx5jNQqR0LPgqdQ"
      Content-Type: "application/json"
    body:
      model: "gpt-oss-120b"
      temperature: 0.0
      max_tokens: 8192
    prompter:
      name: role_content_dict
      args:
        agent_role: "assistant"

updater:
  module: src.client.agents.HTTPAgent
  parameters:
    url: "http://10.32.16.43:4000/chat/completions"
    headers:
      Authorization: "Bearer sk--jYBY-YIx5jNQqR0LPgqdQ"
      Content-Type: "application/json"
    body:
      model: "gpt-oss-120b"
      temperature: 0.7
      max_tokens: 4096
    prompter:
      name: role_content_dict
      args:
        agent_role: "assistant"

# Task worker (must be running: python -m src.start_task -a --config configs/start_task.yaml)
task:
  name: "medagentbench-skill"
  controller_address: "http://localhost:5050/api"
  fhir_api_base: "http://localhost:8080/fhir/"

data:
  full: "data/medagentbench/test_data_v2.json"
  dev:  "data/medagentbench/split_dev.json"
  val:  "data/medagentbench/split_val.json"

evo_memory:
  episodic_enabled: true
  semantic_enabled: true
  episodic_top_k: 3
  semantic_top_k: 8
  max_episodes: 500
  max_semantic_rules: 25
  max_context_chars: 6000

# Match skill_cycle.yaml hyperparameters for a fair comparison
cycle:
  epochs: 5
  update_every: 42
  batch_concurrency: 5
  run_baseline: true
